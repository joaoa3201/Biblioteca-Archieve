<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download | Biblioteca Archive</title>
    <link rel="icon" href="assets/img/livro.png" type="image/png" />
    <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
  </head>

  <body class="pagina-busca">
    <main class="page-content">
      <section class="form-card">
        <div class="form-header">
          <span class="badge">Biblioteca Archive</span>
          <h1 id="tituloDownload">Download da ISO</h1>
          <p id="resumoIso" class="texto-apoio" role="status"></p>
        </div>

        <form id="formDownload" novalidate hidden>
          <div class="form-grid">
            <div class="field">
              <label for="nome">Seu nome</label>
              <input type="text" id="nome" name="nome" maxlength="150" required autocomplete="name" />
            </div>

            <div class="field">
              <label for="email">Seu e-mail</label>
              <input type="email" id="email" name="email" maxlength="254" required autocomplete="email" />
            </div>

            <div class="field">
              <label for="objetivo">Para que você vai usar este sistema?</label>
              <textarea id="objetivo" name="objetivo" rows="3" maxlength="1000" required
                placeholder="Ex.: reaproveitar um notebook antigo para estudos"></textarea>
            </div>
          </div>

          <p id="mensagemErro" class="mensagem-erro" role="alert" hidden></p>

          <div class="actions">
            <button type="submit" id="botaoEnviar" class="btn btn-primary">Liberar download</button>
            <a href="index.html" class="btn btn-secondary btn-link">Voltar</a>
          </div>
        </form>

        <div id="areaLink" class="resumo-final" hidden>
          <h3>Download liberado</h3>
          <p class="texto-apoio">O arquivo é baixado direto do site oficial do sistema.</p>
          <div class="actions">
            <a id="linkDownload" class="btn btn-primary btn-link" target="_blank" rel="noopener noreferrer">Baixar agora</a>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/download.js"></script>
  </body>
</html>
